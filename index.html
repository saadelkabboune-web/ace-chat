<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ace Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#0b141a;color:#fff;display:flex;flex-direction:column;max-width:100%;margin:0 auto;height:100vh;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
#registerScreen{justify-content:center;align-items:center;padding:30px;background:radial-gradient(circle,#1f2c34,#0b141a);text-align:center}
#registerScreen .logo{width:100px;height:100px;background:linear-gradient(135deg,#25d366,#128c7e);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:25px;box-shadow:0 0 40px rgba(37,211,102,0.4)}
#registerScreen h1{font-size:28px;color:#25d366;margin-bottom:8px}
#registerScreen p{color:#8696a0;margin-bottom:30px;font-size:14px;line-height:1.6}
#registerScreen input{width:100%;max-width:320px;padding:16px;background:#1f2c34;border:2px solid #2a3942;border-radius:12px;color:#fff;font-size:16px;margin-bottom:15px;outline:none;text-align:center}
#registerScreen input:focus{border-color:#25d366}
#registerScreen input::placeholder{color:#8696a0}
#registerScreen .btn{width:100%;max-width:320px;padding:16px;background:linear-gradient(135deg,#25d366,#128c7e);border:none;color:#fff;font-size:17px;font-weight:bold;border-radius:12px;cursor:pointer;margin-top:10px}
.header{background:#1f2c34;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,0.3);gap:10px}
.header .title{font-size:18px;font-weight:bold;color:#e9edef;flex:1}
.header .exit-btn{background:rgba(255,43,43,0.2);border:2px solid #ff2b2b;color:#ff2b2b;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.my-code-box{background:linear-gradient(135deg,#25d366,#128c7e);padding:20px;margin:15px;border-radius:20px;text-align:center;box-shadow:0 4px 20px rgba(37,211,102,0.3)}
.my-code-box .label{font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:5px}
.my-code-box .code{font-size:32px;font-weight:bold;color:#fff;letter-spacing:3px;margin:8px 0;font-family:monospace;direction:ltr}
.my-code-box .share-btn{background:rgba(255,255,255,0.2);border:2px solid #fff;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;cursor:pointer;margin-top:5px}
.section-title{padding:15px 20px 10px;font-size:14px;color:#ffd700;font-weight:bold}
.add-friend-box{padding:0 15px 15px}
.add-friend-box .row{display:flex;gap:10px}
.add-friend-box input{flex:1;padding:14px;background:#1f2c34;border:2px solid #2a3942;border-radius:12px;color:#fff;font-size:15px;outline:none;text-align:center;font-family:monospace;letter-spacing:2px}
.add-friend-box input:focus{border-color:#25d366}
.add-friend-box button{background:linear-gradient(135deg,#25d366,#128c7e);border:none;color:#fff;padding:14px 20px;border-radius:12px;font-size:18px;cursor:pointer;font-weight:bold}
.chats-list{flex:1;overflow-y:auto;padding:0 15px 15px;scrollbar-width:none}
.chats-list::-webkit-scrollbar{display:none}
.chat-item{background:rgba(255,255,255,0.05);border:2px solid rgba(37,211,102,0.2);border-radius:15px;padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.chat-item:active{transform:scale(0.98);border-color:#25d366}
.chat-item .avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;flex-shrink:0}
.chat-item .info{flex:1;min-width:0}
.chat-item .name{font-size:16px;font-weight:bold;color:#e9edef;margin-bottom:3px}
.chat-item .code-badge{font-size:11px;color:#25d366;font-family:monospace;margin-top:3px;direction:ltr}
.empty{text-align:center;padding:40px 20px;color:#8696a0}
.empty .icon{font-size:60px;margin-bottom:15px}
.chat-header{background:#1f2c34;padding:12px 15px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,0.3)}
.chat-header .back{background:transparent;border:none;color:#aebac1;font-size:22px;cursor:pointer;padding:5px}
.chat-header .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.chat-header .info{flex:1;min-width:0}
.chat-header .name{font-size:16px;font-weight:bold;color:#e9edef}
.chat-header .status{font-size:11px;color:#25d366;font-family:monospace;direction:ltr}
.messages{flex:1;overflow-y:auto;padding:15px;background:#0b141a;scrollbar-width:none}
.messages::-webkit-scrollbar{display:none}
.msg{max-width:80%;padding:8px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;line-height:1.5;word-wrap:break-word;animation:msgIn 0.3s;cursor:pointer}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.me{background:#005c4b;color:#e9edef;margin-right:auto;border-top-left-radius:0}
.msg.them{background:#202c33;color:#e9edef;margin-left:auto;border-top-right-radius:0}
.msg .time{font-size:10px;color:rgba(233,237,239,0.5);text-align:left;margin-top:3px;display:block}
.msg img{max-width:100%;border-radius:8px;margin:5px 0;display:block}
.typing-indicator{max-width:80%;padding:8px 12px;background:#202c33;border-radius:10px;margin-bottom:8px;display:inline-flex;gap:4px;align-items:center}
.typing-indicator .dot{width:6px;height:6px;background:#8696a0;border-radius:50%;animation:bounce 1.4s infinite}
.typing-indicator .dot:nth-child(2){animation-delay:0.2s}
.typing-indicator .dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-5px);opacity:1}}
.input-area{background:#1f2c34;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.input-box{flex:1;background:#2a3942;border-radius:25px;display:flex;align-items:center;padding:0 15px}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:#e9edef;font-size:15px;padding:12px 0}
.input-box input::placeholder{color:#8696a0}
.icon-btn{width:45px;height:45px;border-radius:50%;background:#2a3942;border:2px solid #25d366;color:#25d366;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.send-btn{width:48px;height:48px;border-radius:50%;background:#25d366;border:none;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
.status{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(37,211,102,0.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:90%}
.status.show{opacity:1}
.status.error{background:rgba(255,43,43,0.9)}
.status.info{background:rgba(37,117,252,0.9)}
.msg-menu{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.msg-menu.active{display:flex}
.msg-menu .box{background:#1f2c34;border-radius:15px;padding:20px;width:100%;max-width:300px;text-align:center}
.msg-menu .box h3{color:#fff;margin-bottom:15px;font-size:16px}
.msg-menu .box button{display:block;width:100%;padding:14px;margin-bottom:10px;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
.msg-menu .box button.del{background:#ff2b2b;color:#fff}
.msg-menu .box button.cancel{background:#2a3942;color:#fff}
.img-viewer{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.img-viewer.active{display:flex}
.img-viewer img{max-width:100%;max-height:100%;border-radius:10px}
.img-viewer .close{position:absolute;top:20px;left:20px;background:rgba(255,255,255,0.2);border:none;color:#fff;width:45px;height:45px;border-radius:50%;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<div id="registerScreen" class="screen active">
  <div class="logo">💬</div>
  <h1>ACE CHAT</h1>
  <p>سجّل مرة واحدة<br>وستحصل على رمزك الخاص</p>
  <input type="text" id="regName" placeholder="اكتب اسمك..." maxlength="15">
  <input type="email" id="regEmail" placeholder="بريدك الإلكتروني..." maxlength="50">
  <button class="btn" onclick="register()">✅ تسجيل</button>
</div>

<div id="homeScreen" class="screen">
  <div class="header">
    <div class="title" id="homeTitle">🏠 الرئيسية</div>
    <button class="exit-btn" onclick="logout()">🚪</button>
  </div>
  <div class="my-code-box">
    <div class="label">🎫 رمزك الخاص</div>
    <div class="code" id="myCodeDisplay">#-------</div>
    <button class="share-btn" onclick="copyCode()">📋 نسخ الرمز</button>
  </div>
  <div class="section-title">➕ إضافة صديق</div>
  <div class="add-friend-box">
    <div class="row">
      <input type="text" id="friendCode" placeholder="#XXXX" maxlength="10">
      <button onclick="addFriend()">➕</button>
    </div>
  </div>
  <div class="section-title">💬 محادثاتك</div>
  <div class="chats-list" id="chatsList"></div>
</div>

<div id="chatScreen" class="screen">
  <div class="chat-header">
    <button class="back" onclick="goHome()">←</button>
    <div class="avatar" id="chatAvatar">?</div>
    <div class="info">
      <div class="name" id="chatName">صديق</div>
      <div class="status" id="chatStatus">#-------</div>
    </div>
  </div>
  <div class="messages" id="messagesBox"></div>
  <div class="input-area">
    <button class="icon-btn" id="imgBtn">📷</button>
    <div class="input-box">
      <input type="text" id="messageInput" placeholder="اكتب رسالة...">
    </div>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
  <input type="file" id="imgInput" accept="image/*" style="display:none">
</div>

<div class="status" id="statusMsg"></div>

<div class="msg-menu" id="msgMenu">
  <div class="box">
    <h3>خيارات الرسالة</h3>
    <button class="del" onclick="deleteMessage()">🗑️ حذف</button>
    <button class="cancel" onclick="closeMsgMenu()">إلغاء</button>
  </div>
</div>

<div class="img-viewer" id="imgViewer" onclick="closeImg()">
  <button class="close" onclick="closeImg()">×</button>
  <img id="imgViewerImg" src="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast, get, set, remove }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAkEIlyARdvOVPiLmkgLe9SlAY3a3-oWgo",
  authDomain: "natski-pro.firebaseapp.com",
  databaseURL: "https://natski-pro-default-rtdb.firebaseio.com",
  projectId: "natski-pro",
  storageBucket: "natski-pro.firebasestorage.app",
  messagingSenderId: "900741149288",
  appId: "1:900741149288:web:69be564f388256278381dd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let me = null;
let friends = [];
let currentFriend = null;
let unsubscribe = null;
let homeUnsub = null;
let typingUnsub = null;
let typingTimer = null;
let isTyping = false;
let lastMessageCount = 0;
let messagesData = [];

function generateCode(name){
  const clean = name.toUpperCase().replace(/[^A-Z\u0600-\u06FF]/g, '').slice(0, 4) || 'USER';
  const num = Math.floor(10 + Math.random() * 90);
  return clean + num;
}
function sanitizeKey(key){ return key.replace(/[.#$\[\]]/g, '_'); }

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let statusTimer;
function showStatus(msg, type){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status show';
  if(type) el.classList.add(type);
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function formatTime(ts){
  const d = new Date(ts);
  return d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes();
}

window.register = async function(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  if(!name){ showStatus('⚠️ اكتب اسمك', 'error'); return; }
  if(!email || email.indexOf('@') === -1){ showStatus('⚠️ اكتب بريدك', 'error'); return; }
  showStatus('⏳ جاري التسجيل...', 'info');
  try {
    const emailKey = sanitizeKey(email);
    const emailSnap = await get(ref(db, 'emails/' + emailKey));
    if(emailSnap.exists()){
      const existingCode = emailSnap.val();
      const userSnap = await get(ref(db, 'users/' + existingCode));
      if(userSnap.exists()){
        me = userSnap.val();
        localStorage.setItem('ace_me', JSON.stringify(me));
        showStatus('✅ مرحباً بعودتك: #' + me.code);
        setTimeout(() => goHome(), 500);
        return;
      }
    }
    let code = sanitizeKey(generateCode(name));
    let tries = 0;
    while(tries < 20){
      const checkSnap = await get(ref(db, 'users/' + code));
      if(!checkSnap.exists()) break;
      code = sanitizeKey(generateCode(name));
      tries++;
    }
    me = { name, email, code };
    await set(ref(db, 'users/' + code), { name, email, code });
    await set(ref(db, 'emails/' + emailKey), code);
    localStorage.setItem('ace_me', JSON.stringify(me));
    showStatus('✅ تم التسجيل: #' + code);
    setTimeout(() => goHome(), 500);
  } catch(e){
    showStatus('❌ فشل: ' + (e.message || 'خطأ'), 'error');
  }
};

window.goHome = function(){
  if(!me){ showScreen('registerScreen'); return; }
  if(typingUnsub) typingUnsub();
  if(unsubscribe) unsubscribe();
  currentFriend = null;
  document.getElementById('myCodeDisplay').textContent = '#' + me.code;
  document.getElementById('homeTitle').textContent = '🏠 ' + me.name;
  showScreen('homeScreen');
  loadFriends();
};

window.copyCode = function(){
  if(!me) return;
  const fullCode = '#' + me.code;
  try {
    navigator.clipboard.writeText(fullCode).then(() => showStatus('📋 تم نسخ: ' + fullCode)).catch(() => showStatus('الرمز: ' + fullCode));
  } catch(e){ showStatus('الرمز: ' + fullCode); }
};

function loadFriends(){
  if(homeUnsub) homeUnsub();
  const friendsRef = ref(db, 'users/' + me.code + '/friends');
  homeUnsub = onValue(friendsRef, async (snap) => {
    const data = snap.val() || {};
    friends = [];
    const codes = Object.keys(data);
    for(let i=0;i<codes.length;i++){
      try {
        const userSnap = await get(ref(db, 'users/' + codes[i]));
        if(userSnap.exists()) friends.push(userSnap.val());
      } catch(e){}
    }
    renderFriends();
  });
}

function renderFriends(){
  const box = document.getElementById('chatsList');
  if(friends.length === 0){
    box.innerHTML = '<div class="empty"><div class="icon">💬</div><p>لا توجد محادثات بعد</p><p style="font-size:12px;margin-top:8px">أضف صديقاً برمزه</p></div>';
    return;
  }
  box.innerHTML = friends.map(f => {
    const initial = f.name.charAt(0).toUpperCase();
    return '<div class="chat-item" onclick="openChat(\'' + f.code + '\',\'' + escapeHtml(f.name) + '\')">' +
      '<div class="avatar">' + initial + '</div>' +
      '<div class="info"><div class="name">' + escapeHtml(f.name) + '</div>' +
      '<div class="code-badge">#' + f.code + '</div></div></div>';
  }).join('');
}

window.addFriend = async function(){
  let code = document.getElementById('friendCode').value.trim().toUpperCase().replace('#', '');
  code = sanitizeKey(code);
  if(!code){ showStatus('⚠️ اكتب الرمز', 'error'); return; }
  if(code === me.code){ showStatus('⚠️ هذا رمزك!', 'error'); return; }
  try {
    const snap = await get(ref(db, 'users/' + code));
    if(!snap.exists()){ showStatus('❌ الرمز غير موجود', 'error'); return; }
    await set(ref(db, 'users/' + me.code + '/friends/' + code), true);
    await set(ref(db, 'users/' + code + '/friends/' + me.code), true);
    document.getElementById('friendCode').value = '';
    showStatus('✅ تمت الإضافة');
  } catch(e){ showStatus('❌ فشل الإضافة', 'error'); }
};

window.openChat = function(friendCode, friendName){
  currentFriend = { code: friendCode, name: friendName };
  document.getElementById('chatName').textContent = friendName;
  document.getElementById('chatStatus').textContent = '#' + friendCode;
  document.getElementById('chatAvatar').textContent = friendName.charAt(0).toUpperCase();
  showScreen('chatScreen');
  lastMessageCount = 0;
  listenMessages();
  listenTyping();
  setupChatEvents();
  setTimeout(() => document.getElementById('messageInput').focus(), 300);
};

function setupChatEvents(){
  const sendBtn = document.getElementById('sendBtn');
  const input = document.getElementById('messageInput');
  const imgBtn = document.getElementById('imgBtn');
  const imgInput = document.getElementById('imgInput');
  sendBtn.onclick = sendMessage;
  input.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); } };
  input.oninput = () => {
    if(!currentFriend) return;
    if(!isTyping){
      isTyping = true;
      set(ref(db, 'typing/' + getChatId(me.code, currentFriend.code) + '/' + me.code), true);
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      isTyping = false;
      remove(ref(db, 'typing/' + getChatId(me.code, currentFriend.code) + '/' + me.code));
    }, 2000);
  };
  imgBtn.onclick = () => imgInput.click();
  imgInput.onchange = handleImage;
}

function getChatId(c1, c2){ const s = [c1, c2].sort(); return s[0] + '_' + s[1]; }

function listenMessages(){
  if(unsubscribe) unsubscribe();
  const chatId = getChatId(me.code, currentFriend.code);
  const msgRef = query(ref(db, 'chats/' + chatId), limitToLast(100));
  unsubscribe = onValue(msgRef, (snap) => {
    const box = document.getElementById('messagesBox');
    const data = snap.val();
    if(!data){
      box.innerHTML = '<div class="empty" style="padding:40px 20px"><p style="color:#8696a0">💬 ابدأ المحادثة</p></div>';
      messagesData = [];
      lastMessageCount = 0;
      return;
    }
    messagesData = Object.keys(data).map(k => ({ id: k, ...data[k] })).sort((a,b) => (a.ts||0) - (b.ts||0));
    const newCount = messagesData.length;
    if(lastMessageCount > 0 && newCount > lastMessageCount){
      const lastMsg = messagesData[newCount - 1];
      if(lastMsg.from !== me.code) beep();
    }
    lastMessageCount = newCount;
    box.innerHTML = messagesData.map(m => {
      const isMe = m.from === me.code;
      const time = m.ts ? formatTime(m.ts) : 'الآن';
      let content = '';
      if(m.type === 'image' && m.image){
        content = '<img src="' + m.image + '" onclick="event.stopPropagation();viewImg(\'' + m.id + '\')">';
      } else {
        content = escapeHtml(m.text || '');
      }
      return '<div class="msg ' + (isMe ? 'me' : 'them') + '" ' +
        'ontouchstart="startMsgTouch(\'' + m.id + '\')" ontouchend="cancelMsgTouch()" ' +
        'oncontextmenu="showMsgMenu(\'' + m.id + '\');return false;">' +
        content + '<span class="time">' + time + '</span></div>';
    }).join('');
    box.scrollTop = box.scrollHeight;
  });
}

function listenTyping(){
  if(typingUnsub) typingUnsub();
  const chatId = getChatId(me.code, currentFriend.code);
  const typingRef = ref(db, 'typing/' + chatId + '/' + currentFriend.code);
  typingUnsub = onValue(typingRef, (snap) => {
    const isT = snap.val();
    const box = document.getElementById('messagesBox');
    let indicator = document.getElementById('typingInd');
    if(isT){
      if(!indicator){
        const div = document.createElement('div');
        div.id = 'typingInd';
        div.className = 'typing-indicator';
        div.innerHTML = '<span style="font-size:11px;color:#8696a0;margin-right:5px">يكتب</span><div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }
    } else {
      if(indicator) indicator.remove();
    }
  });
}

function sendMessage(){
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if(!text || !currentFriend) return;
  const chatId = getChatId(me.code, currentFriend.code);
  push(ref(db, 'chats/' + chatId), {
    from: me.code, to: currentFriend.code, text: text, type: 'text', ts: Date.now()
  });
  isTyping = false;
  clearTimeout(typingTimer);
  remove(ref(db, 'typing/' + chatId + '/' + me.code));
  input.value = '';
  input.focus();
}

function handleImage(e){
  const file = e.target.files[0];
  if(!file || !currentFriend) return;
  showStatus('⏳ جاري معالجة الصورة...', 'info');
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const max = 600;
      if(w > max || h > max){
        if(w > h){ h = h * (max/w); w = max; }
        else { w = w * (max/h); h = max; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      let quality = 0.7;
      let dataUrl = canvas.toDataURL('image/jpeg', quality);
      while(dataUrl.length > 300000 && quality > 0.2){
        quality -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
      }
      if(dataUrl.length > 400000){
        showStatus('⚠️ الصورة كبيرة جداً', 'error');
        return;
      }
      const chatId = getChatId(me.code, currentFriend.code);
      push(ref(db, 'chats/' + chatId), {
        from: me.code, to: currentFriend.code, type: 'image', image: dataUrl, ts: Date.now()
      });
      showStatus('✅ تم إرسال الصورة');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

window.viewImg = function(msgId){
  const msg = messagesData.find(m => m.id === msgId);
  if(msg && msg.image){
    document.getElementById('imgViewerImg').src = msg.image;
    document.getElementById('imgViewer').classList.add('active');
  }
};
window.closeImg = function(){
  document.getElementById('imgViewer').classList.remove('active');
};

let msgTouchTimer = null;
let msgToDelete = null;
window.startMsgTouch = function(id){
  msgTouchTimer = setTimeout(() => {
    msgToDelete = id;
    document.getElementById('msgMenu').classList.add('active');
  }, 600);
};
window.cancelMsgTouch = function(){ clearTimeout(msgTouchTimer); };
window.showMsgMenu = function(id){
  msgToDelete = id;
  document.getElementById('msgMenu').classList.add('active');
};
window.closeMsgMenu = function(){
  document.getElementById('msgMenu').classList.remove('active');
  msgToDelete = null;
};
window.deleteMessage = async function(){
  if(!msgToDelete || !currentFriend) return;
  const chatId = getChatId(me.code, currentFriend.code);
  try {
    await remove(ref(db, 'chats/' + chatId + '/' + msgToDelete));
    showStatus('🗑️ تم الحذف');
  } catch(e){ showStatus('❌ فشل', 'error'); }
  closeMsgMenu();
};

function beep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; gain.gain.value = 0.1;
    osc.start(); osc.stop(ctx.currentTime + 0.15);
    if(navigator.vibrate) navigator.vibrate(100);
  } catch(e){}
}

window.logout = function(){
  if(confirm('هل تريد الخروج؟')){
    localStorage.removeItem('ace_me');
    me = null;
    if(homeUnsub) homeUnsub();
    if(unsubscribe) unsubscribe();
    if(typingUnsub) typingUnsub();
    showScreen('registerScreen');
  }
};

window.addEventListener('load', () => {
  try {
    const saved = localStorage.getItem('ace_me');
    if(saved){ me = JSON.parse(saved); goHome(); }
    else { showScreen('registerScreen'); }
  } catch(e){ showScreen('registerScreen'); }
});
</script>
